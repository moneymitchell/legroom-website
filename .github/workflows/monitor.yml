# The slow alarm. Weekly Lighthouse and a link check against the deployed site.
#
# CI proves the code was good the day it shipped. This is what notices six
# months later, when nobody is looking, that an image got heavier, a third
# party started blocking, or a link rotted.
#
# >>> AT CUTOVER: change TARGET below to https://legroomcompany.com and delete
# >>> the CF_ACCESS secrets from the repository. The apex is public, so the
# >>> service token stops being needed the moment the apex is the target.
name: Monitor

on:
  schedule:
    # Mondays, 09:00 UTC. Early enough in the week that a regression has five
    # working days to get fixed, not discovered on a Friday night.
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      url:
        description: "URL to check. Defaults to staging."
        required: false
        type: string

permissions:
  contents: read

jobs:
  check:
    name: lighthouse and links
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # The cutover target. GitHub does not allow one env entry to reference
      # another, so this literal is the one to change, not a DEFAULT_URL above
      # it that would sit there unused and look authoritative.
      TARGET: ${{ inputs.url || 'https://preview.legroomcompany.com' }}
      # Staging sits behind Cloudflare Access, so an unauthenticated request
      # gets the Access login page rather than the site: Lighthouse would
      # cheerfully score the login screen and report a green 100. A service
      # token is the supported way for a machine to pass Access.
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Confirm the target is the site and not a login page
        # The whole point of this job is to catch silent degradation, so it
        # must not itself degrade silently. If Access is in front and no
        # service token is configured, say so and stop rather than grading
        # Cloudflare's login screen.
        run: |
          code=$(curl -s -o body.html -w "%{http_code}" \
            -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" \
            -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" \
            "$TARGET")
          echo "HTTP $code from $TARGET"
          if [ "$code" != "200" ]; then
            echo "::error::$TARGET returned $code."
            exit 1
          fi
          if grep -qi "cloudflare access\|cf-access-login" body.html; then
            echo "::error::Reached the Cloudflare Access login page, not the site. Set the CF_ACCESS_CLIENT_ID and CF_ACCESS_CLIENT_SECRET repository secrets from an Access service token."
            exit 1
          fi
          if ! grep -qi "legroom" body.html; then
            echo "::error::The response does not look like the Legroom site."
            exit 1
          fi

      - name: Lighthouse, mobile and desktop
        # The config is generated by node rather than a shell heredoc. It has
        # to carry a headers object and a URL from the environment, and
        # hand-quoting JSON inside a heredoc inside YAML is three levels of
        # escaping deep with nothing to catch a mistake until the run fails.
        #
        # Thresholds sit below CI's. CI measures a static build on a quiet
        # runner; this measures the real thing over the public internet through
        # Cloudflare, and a shared runner having a bad minute must not page
        # anyone. It exists to catch a trend, not a jitter.
        run: |
          gen() {
            node -e '
              const [preset, outputDir] = process.argv.slice(1);
              const headers = {};
              if (process.env.CF_ACCESS_CLIENT_ID) {
                headers["CF-Access-Client-Id"] = process.env.CF_ACCESS_CLIENT_ID;
                headers["CF-Access-Client-Secret"] = process.env.CF_ACCESS_CLIENT_SECRET;
              }
              const config = {
                ci: {
                  collect: {
                    url: [process.env.TARGET],
                    numberOfRuns: 3,
                    settings: {
                      preset,
                      chromeFlags: "--no-sandbox --headless=new",
                      extraHeaders: headers,
                    },
                  },
                  assert: {
                    assertions: {
                      "categories:performance": ["error", { minScore: 0.9 }],
                      "categories:accessibility": ["error", { minScore: 0.94 }],
                      "categories:best-practices": ["error", { minScore: 0.95 }],
                      "categories:seo": ["error", { minScore: 0.95 }],
                      "unused-javascript": "off",
                      "legacy-javascript": "off",
                      "uses-long-cache-ttl": "off",
                      "color-contrast": "off",
                    },
                  },
                  upload: { target: "filesystem", outputDir },
                },
              };
              require("node:fs").writeFileSync(`lhci.${preset}.json`, JSON.stringify(config, null, 2));
            ' "$1" "$2"
          }
          gen desktop .lh-desktop
          gen mobile .lh-mobile
          npx lhci autorun --config=lhci.desktop.json
          npx lhci autorun --config=lhci.mobile.json

      - name: Link check
        # cal.com and the social hosts rate-limit or block datacentre IPs and
        # will report false 403s. They are verified by hand in the live QA
        # sweep instead.
        run: |
          npx --yes linkinator "$TARGET" \
            --recurse \
            --skip "cal\.com|linkedin\.com|instagram\.com|x\.com|twitter\.com" \
            --header "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" \
            --header "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}"

      - name: Upload the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: monitor-lighthouse-${{ github.run_id }}
          path: |
            .lh-desktop/
            .lh-mobile/
          retention-days: 30
          if-no-files-found: ignore

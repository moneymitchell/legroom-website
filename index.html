  <style>
    :root {
      --sky: #1479DC;
      --charcoal: #1C1C1A;
      --bone: #F2EFE9;
      --yellow: #FFC800;
      --yellow-base: #C79B00;
      --font-display: Oswald, "Arial Narrow", "Roboto Condensed", "Helvetica Neue", Arial, sans-serif;
      --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      --lift: 10px;                        /* extrusion depth at rest */
      --press: calc(var(--lift) - 2px);    /* travel on press: face sinks to a 2px base, silhouette height unchanged */
      --content-top: 40%;                  /* vertical anchor of the content block */
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--sky);
      overflow: hidden;
    }

    body {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      font-family: var(--font-body);
      color: var(--charcoal);
      -webkit-font-smoothing: antialiased;
    }

    .sky {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }
    .sky img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
    }

    .content {
      position: absolute;
      z-index: 1;
      left: 50%;
      top: var(--content-top);
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      width: max-content;
      max-width: 100%;
      padding: 0 16px;
    }

    .logo {
      display: block;
      width: clamp(260px, 42vw, 560px);
      height: auto;
      aspect-ratio: 4496.7 / 896;
      overflow: visible;
    }
    .logo .mark { fill: var(--yellow); }
    .logo .word { fill: var(--bone); }

    /* The sign: a chunky arcade button that presses itself every few seconds. */
    @property --depth {
      syntax: "<length>";
      inherits: false;
      initial-value: 10px;
    }

    .sign {
      --depth: var(--lift);
      position: relative;
      display: block;
      margin: 5vh 0 calc(var(--lift) + 3px);       /* bottom margin reserves the extrusion */
      width: 276px;                                 /* fixed, so a wider fallback font cannot resize the sign */
      height: 66px;
      line-height: 60px;                            /* 66 minus the 3px borders */
      padding: 0 44px;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 26px;
      letter-spacing: .10em;
      text-transform: uppercase;
      text-align: center;
      white-space: nowrap;
      color: var(--charcoal);
      background: var(--yellow);
      border: 3px solid var(--charcoal);
      border-radius: 14px;                          /* deliberate exception to the sharp-corners rule */
      user-select: none;
      -webkit-user-select: none;
      transform: translateY(0);
      box-shadow:
        inset 0 2px 0 rgba(255, 255, 255, .45),
        0 var(--depth) 0 var(--yellow-base),
        0 var(--depth) 0 3px var(--charcoal),
        0 calc(var(--depth) + 8px) 22px rgba(0, 0, 0, .28);
      animation: sign-press 4.6s cubic-bezier(.2, 0, .1, 1) 1.8s infinite;
      will-change: transform;
    }

    /* Idle physics: long rest, quick press into the base, small overshoot on release, settle. */
    @keyframes sign-press {
      0%, 88%   { --depth: var(--lift); transform: translateY(0); }
      90%, 94%  { --depth: 2px; transform: translateY(var(--press)); }
      97%       { --depth: calc(var(--lift) + 2px); transform: translateY(-2px); }
      100%      { --depth: var(--lift); transform: translateY(0); }
    }

    @media (max-width: 767px) {
      :root { --lift: 8px; --content-top: 27%; }   /* 27%, not 38%: the mobile crop has a cloud bank at 26 to 31% and the logo must clear it */
      .sign { font-size: 19px; height: 54px; line-height: 48px; padding: 0 20px; width: 208px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .sign { animation: none; }
    }
  </style>
